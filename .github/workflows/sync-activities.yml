name: Sync campus activities

on:
  schedule:
    # UTC 16:30 = Asia/Shanghai 00:30 on the following day.
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-campus-activities
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Fetch this week's activities
        run: node scripts/scrape-activities.mjs

      - name: Verify the site build
        run: |
          npm ci
          npm run docs:build

      - name: Commit refreshed activities
        run: |
          if git diff --quiet -- docs/.vitepress/data/activities.js docs/public/activity; then
            echo "Activity data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.vitepress/data/activities.js docs/public/activity
          git commit -m "chore: refresh campus activities"
          git push
