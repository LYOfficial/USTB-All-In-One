server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Gzip compression for faster loads
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # Increment and return the persistent homepage view count.
    location = /api/page-view {
        proxy_pass http://127.0.0.1:3000/page-view;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location = /api/page-view/health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        access_log off;
    }

    # VitePress emits /assets/* and a few top-level HTML files.
    # Long cache for fingerprinted assets, short cache for HTML.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Pretty URLs: VitePress uses clean paths (/tools, /materials).
    # Try the requested file, then directory index, then 404.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Custom 404
    error_page 404 /404.html;
}
